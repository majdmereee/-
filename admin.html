<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الإدارة المدرع | SafeMode AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #0f172a; color: #f8fafc; }
        .glass-panel { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.05); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #ef4444; border-radius: 4px; }
        .toast { transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
        .loader { border-top-color: #ef4444; -webkit-animation: spinner 1s linear infinite; animation: spinner 1s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <header class="glass-panel px-6 py-4 flex justify-between items-center z-10 shadow-2xl shrink-0 border-b-2 border-red-500/20">
        <div class="flex items-center gap-4">
            <div class="bg-red-600 p-3 rounded-xl shadow-lg shadow-red-500/30">
                <i class="fa-solid fa-shield-halved text-2xl"></i>
            </div>
            <div>
                <h1 class="font-black text-2xl text-white">النظام المدرع (SafeMode)</h1>
                <p class="text-xs text-slate-400 font-medium mt-1">حماية ثلاثية الطبقات لمنع تخريب الموقع</p>
            </div>
        </div>
        <div class="flex gap-3">
            <button onclick="toggleSettings()" class="bg-slate-700 hover:bg-slate-600 px-5 py-2 rounded-lg font-bold transition flex items-center gap-2">
                <i class="fa-solid fa-gear"></i> إعدادات
            </button>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden p-4 gap-4 max-w-[1200px] w-full mx-auto relative">
        <main class="flex-1 glass-panel rounded-2xl flex flex-col overflow-hidden shadow-2xl">
            <div class="p-4 border-b border-slate-700 bg-slate-800/50 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <span class="w-3 h-3 rounded-full bg-red-500 animate-pulse"></span>
                    <span class="font-bold text-sm">وحدة التحكم الآمنة</span>
                </div>
                <div class="text-xs font-mono text-slate-400" id="repoStatus">جاري فحص حالة الملفات...</div>
            </div>

            <div id="chatMessages" class="flex-1 p-6 overflow-y-auto custom-scrollbar space-y-6">
                <div class="flex gap-4 items-start">
                    <div class="w-10 h-10 rounded-xl bg-red-600 flex items-center justify-center shrink-0 shadow-lg">
                        <i class="fa-solid fa-shield"></i>
                    </div>
                    <div class="bg-slate-700/50 border border-slate-600 rounded-2xl rounded-tr-none p-5 max-w-[85%] shadow-md">
                        <p class="leading-relaxed font-bold text-slate-200">
                            تم تفعيل بروتوكول الحماية القصوى 🛡️<br><br>
                            لن أسمح للذكاء الاصطناعي برفع كود فارغ، ولن أسمح له بمسح وجباتك. أي خطأ من Gemini سيتم حظره فوراً داخل المتصفح قبل أن يصل إلى GitHub!
                        </p>
                    </div>
                </div>
            </div>

            <div class="p-4 border-t border-slate-700 bg-slate-800/80">
                <form id="chatForm" class="flex flex-col gap-3">
                    <div class="flex gap-2">
                        <input type="text" id="userInput" placeholder="اطلب التعديل بثقة. النظام سيحميك..." 
                            class="flex-1 bg-slate-900 border border-slate-600 rounded-xl px-5 py-3 text-sm font-medium focus:outline-none focus:border-red-500 text-white transition">
                        
                        <button type="submit" id="sendBtn" class="bg-red-600 hover:bg-red-500 text-white px-8 py-3 rounded-xl font-bold text-sm flex items-center gap-2 transition shadow-lg shadow-red-600/30 disabled:opacity-50">
                            <span>تنفيذ آمن</span>
                            <i class="fa-solid fa-lock"></i>
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50 hidden">
        <div class="glass-panel rounded-2xl max-w-lg w-full p-8 shadow-2xl">
            <h3 class="font-black text-xl text-white mb-6">مفاتيح النظام</h3>
            <div class="space-y-4">
                <input type="password" id="geminiKey" placeholder="Gemini API Key" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white">
                <input type="password" id="githubToken" placeholder="GitHub Token" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white" onchange="autoDetectRepo()">
                <select id="repoSelect" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white cursor-pointer"></select>
            </div>
            <button onclick="saveSettings()" class="w-full mt-6 bg-red-600 hover:bg-red-500 text-white font-bold py-3 rounded-lg transition">حفظ</button>
        </div>
    </div>

    <div id="toastContainer" class="fixed bottom-5 left-5 z-50 flex flex-col gap-2"></div>

    <script>
        // --- State ---
        let currentMenuData = [];
        let currentMenuSha = "";
        let currentHtmlData = "";
        let currentHtmlSha = "";
        let previousInteractionId = null; 

        // --- Core Utils ---
        const utf8_to_b64 = str => btoa(unescape(encodeURIComponent(str)));
        const b64_to_utf8 = str => decodeURIComponent(escape(atob(str)));
        
        const showToast = (msg, type = 'info') => {
            const colors = { success: 'bg-emerald-600', error: 'bg-red-600', info: 'bg-blue-600' };
            const toast = document.createElement('div');
            toast.className = `${colors[type]} text-white px-5 py-3 rounded-xl shadow-lg flex items-center gap-3 text-sm font-bold toast translate-y-10 opacity-0`;
            toast.innerHTML = `<span>${msg}</span>`;
            document.getElementById('toastContainer').appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-y-10', 'opacity-0'));
            setTimeout(() => { toast.classList.add('translate-y-10', 'opacity-0'); setTimeout(() => toast.remove(), 300); }, 4000);
        };

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('chatForm').addEventListener('submit', handleSecureExecution);
            const [savedGemini, savedGit, savedRepo] = ['GEMINI_KEY', 'GITHUB_TOKEN', 'GITHUB_REPO'].map(k => localStorage.getItem(k) || '');
            document.getElementById('geminiKey').value = savedGemini;
            document.getElementById('githubToken').value = savedGit;
            if (!savedGemini || !savedGit) toggleSettings();
            else autoDetectRepo(savedRepo);
        });

        function toggleSettings() { document.getElementById('settingsModal').classList.toggle('hidden'); }
        
        function saveSettings() {
            localStorage.setItem('GEMINI_KEY', document.getElementById('geminiKey').value.trim());
            localStorage.setItem('GITHUB_TOKEN', document.getElementById('githubToken').value.trim());
            localStorage.setItem('GITHUB_REPO', document.getElementById('repoSelect').value);
            toggleSettings();
            fetchRepositoryData();
        }

        async function autoDetectRepo(defaultSelect = '') {
            const token = document.getElementById('githubToken').value.trim();
            if (!token) return;
            try {
                const res = await fetch('https://api.github.com/user/repos?per_page=100&sort=updated', { headers: { 'Authorization': `token ${token}` }});
                const repos = await res.json();
                const select = document.getElementById('repoSelect');
                select.innerHTML = repos.map(r => `<option value="${r.full_name}">${r.full_name}</option>`).join('');
                if (defaultSelect) select.value = defaultSelect;
                fetchRepositoryData();
            } catch (err) {}
        }

        async function fetchRepositoryData() {
            const token = localStorage.getItem('GITHUB_TOKEN');
            const repo = document.getElementById('repoSelect').value;
            if (!token || !repo) return;
            try {
                const jsonRes = await fetch(`https://api.github.com/repos/${repo}/contents/menu.json`, { headers: { 'Authorization': `token ${token}` }});
                if (jsonRes.ok) {
                    const data = await jsonRes.json();
                    currentMenuSha = data.sha;
                    currentMenuData = JSON.parse(b64_to_utf8(data.content));
                }
                const htmlRes = await fetch(`https://api.github.com/repos/${repo}/contents/index.html`, { headers: { 'Authorization': `token ${token}` }});
                if (htmlRes.ok) {
                    const data = await htmlRes.json();
                    currentHtmlSha = data.sha;
                    currentHtmlData = b64_to_utf8(data.content);
                }
                document.getElementById('repoStatus').innerText = `✅ متصل ومحمي`;
            } catch (err) {
                document.getElementById('repoStatus').innerText = `❌ فشل الاتصال`;
            }
        }

        function appendMsg(role, content, isAlert = false) {
            const box = document.getElementById('chatMessages');
            const isUser = role === 'user';
            const html = `
                <div class="flex gap-4 items-start ${isUser ? 'flex-row-reverse' : ''}">
                    <div class="w-10 h-10 rounded-xl ${isUser ? 'bg-slate-700' : (isAlert ? 'bg-red-600' : 'bg-sky-600')} flex items-center justify-center shrink-0 shadow-lg">
                        <i class="fa-solid ${isUser ? 'fa-user' : (isAlert ? 'fa-triangle-exclamation' : 'fa-code')} text-white"></i>
                    </div>
                    <div class="${isUser ? 'bg-blue-600 text-white' : (isAlert ? 'bg-red-900/50 border-red-500 text-red-200' : 'bg-slate-700/80 text-slate-200 border-slate-600')} border rounded-2xl ${isUser ? 'rounded-tl-none' : 'rounded-tr-none'} p-5 max-w-[85%] shadow-md text-sm leading-relaxed whitespace-pre-wrap font-medium">
                        ${content}
                    </div>
                </div>`;
            box.insertAdjacentHTML('beforeend', html);
            box.scrollTop = box.scrollHeight;
        }

        // --- The Bulletproof AI Engine ---
        async function handleSecureExecution(e) {
            e.preventDefault();
            const prompt = document.getElementById('userInput').value.trim();
            const btnEl = document.getElementById('sendBtn');
            if (!prompt) return;

            const [geminiKey, ghToken, repo] = ['GEMINI_KEY', 'GITHUB_TOKEN', 'GITHUB_REPO'].map(k => localStorage.getItem(k));
            if (!geminiKey) return showToast('المفاتيح مفقودة', 'error');

            appendMsg('user', prompt);
            document.getElementById('userInput').value = '';
            btnEl.disabled = true;
            btnEl.innerHTML = `<div class="loader w-4 h-4 rounded-full border-2 border-white"></div>`;

            try {
                const systemInstruction = `أنت الذكاء الاصطناعي لمطعم.
                [menu.json]: ${JSON.stringify(currentMenuData)}
                [index.html]: ${currentHtmlData}
                
                تعليمات صارمة للمخرجات:
                - يجب أن تضع "has_menu_changes": true فقط إذا قمت بتعديل الوجبات حقاً.
                - يجب أن تضع "has_html_changes": true فقط إذا قمت بتعديل الواجهة حقاً.
                - لا تحذف أي وجبة قديمة ما لم يطلب المستخدم الحذف.
                - إذا عدلت HTML، يجب أن يكون كوداً كاملاً يحتوي على <html> و <body>. لا ترجع أبداً نصوصاً مثل "null" أو "undefined" أو "لا يوجد تغيير".`;

                const requestBody = {
                    model: "gemini-3.6-flash",
                    input: [{ type: "text", text: systemInstruction }, { type: "text", text: prompt }],
                    response_format: {
                        type: "text",
                        mime_type: "application/json",
                        schema: {
                            type: "object",
                            properties: {
                                reply: { type: "string" },
                                has_menu_changes: { type: "boolean" },
                                updated_menu: { type: "array", items: { type: "object", properties: { id: {type: "integer"}, name: {type: "string"}, category: {type: "string"}, price: {type: "string"}, description: {type: "string"} } } },
                                has_html_changes: { type: "boolean" },
                                updated_html: { type: "string" }
                            },
                            required: ["reply", "has_menu_changes", "has_html_changes"]
                        }
                    }
                };
                if (previousInteractionId) requestBody.previous_interaction_id = previousInteractionId;

                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/interactions?key=${geminiKey}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(requestBody)
                });
                const data = await res.json();
                if (data.id) previousInteractionId = data.id;

                let replyText = data.steps?.find(s => s.type === "model_output")?.content?.find(c => c.type === "text")?.text || "";
                if (!replyText) throw new Error("استجابة فارغة من غوغل.");
                
                const jsonMatch = replyText.match(/\{[\s\S]*\}/);
                const parsedResult = JSON.parse(jsonMatch[0]);
                let messages = [];

                // --- Security Firewall for HTML ---
                if (parsedResult.has_html_changes && parsedResult.updated_html) {
                    const newHtml = parsedResult.updated_html.trim().toLowerCase();
                    // طبقة الحماية القصوى ضد هلوسة الـ HTML
                    if (newHtml === "null" || newHtml === "undefined" || newHtml.length < 50 || (!newHtml.includes("<html") && !newHtml.includes("<body"))) {
                        throw new Error("🚨 تم حظر العملية: الذكاء الاصطناعي حاول تدمير كود الـ HTML وإرسال كود غير صالح.");
                    }
                    
                    currentHtmlData = parsedResult.updated_html;
                    const ghResHtml = await fetch(`https://api.github.com/repos/${repo}/contents/index.html`, {
                        method: 'PUT', headers: { 'Authorization': `token ${ghToken}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: "Secure UI Update", content: utf8_to_b64(currentHtmlData), sha: currentHtmlSha })
                    });
                    currentHtmlSha = (await ghResHtml.json()).content.sha;
                    messages.push("✅ تم التعديل على الواجهة بآمان.");
                }

                // --- Security Firewall for JSON ---
                if (parsedResult.has_menu_changes && parsedResult.updated_menu) {
                    if (parsedResult.updated_menu.length === 0 && currentMenuData.length > 0 && !prompt.includes("احذف")) {
                         throw new Error("🚨 تم حظر العملية: محاولة مسح كل قاعدة البيانات بدون إذن صريح.");
                    }
                    
                    currentMenuData = parsedResult.updated_menu;
                    const ghRes = await fetch(`https://api.github.com/repos/${repo}/contents/menu.json`, {
                        method: 'PUT', headers: { 'Authorization': `token ${ghToken}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: "Secure Data Update", content: utf8_to_b64(JSON.stringify(currentMenuData, null, 2)), sha: currentMenuSha })
                    });
                    currentMenuSha = (await ghRes.json()).content.sha;
                    messages.push("✅ تم التعديل على البيانات بآمان.");
                }

                appendMsg('model', parsedResult.reply + "\n\n" + messages.join("\n"));

            } catch (err) {
                appendMsg('model', err.message, true);
                showToast('تم التدخل الأمني ومنع التخريب', 'error');
            } finally {
                btnEl.disabled = false;
                btnEl.innerHTML = `<span>تنفيذ آمن</span><i class="fa-solid fa-lock"></i>`;
            }
        }
    </script>
</body>
</html>
