<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة الطعام المميزة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ea580c;
            --primary-light: #ffedd5;
            --primary-dark: #c2410c;
            --bg-color: #fafaf9;
            --card-bg: #ffffff;
            --text-main: #1c1917;
            --text-muted: #78716c;
            --border-color: #f5f5f4;
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.02);
            --shadow-md: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.01);
            --shadow-lg: 0 20px 30px -10px rgba(234, 88, 12, 0.15);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 60px;
            min-height: 100vh;
        }

        /* Header Banner */
        .hero-banner {
            background: linear-gradient(135deg, #7c2d12 0%, #ea580c 50%, #f97316 100%);
            color: white;
            padding: 48px 20px 60px;
            text-align: center;
            border-radius: 0 0 32px 32px;
            box-shadow: 0 10px 30px rgba(124, 45, 18, 0.2);
            position: relative;
            overflow: hidden;
        }

        .hero-banner::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            pointer-events: none;
        }

        .hero-title {
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .hero-subtitle {
            font-size: 1.15rem;
            opacity: 0.92;
            max-width: 500px;
            margin: 0 auto;
            font-weight: 500;
        }

        /* Container */
        .container {
            max-width: 1140px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Search Section */
        .search-wrapper {
            margin-top: -28px;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            position: relative;
            z-index: 10;
        }

        .search-box {
            position: relative;
            width: 100%;
            max-width: 580px;
        }

        .search-input {
            width: 100%;
            padding: 16px 50px 16px 20px;
            background: var(--card-bg);
            border: 2px solid transparent;
            border-radius: 30px;
            font-size: 1.05rem;
            color: var(--text-main);
            box-shadow: var(--shadow-md);
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: var(--shadow-lg);
        }

        .search-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.2rem;
            pointer-events: none;
        }

        /* Categories Filter */
        .categories-wrapper {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 35px;
            padding: 5px;
        }

        .category-btn {
            background-color: var(--card-bg);
            border: 1px solid #e7e5e4;
            padding: 10px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.98rem;
            font-weight: 700;
            color: var(--text-muted);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow-sm);
        }

        .category-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
        }

        .category-btn.active {
            background-color: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 6px 16px rgba(234, 88, 12, 0.3);
        }

        /* Menu Grid */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        /* Menu Item Card */
        .card {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            padding: 24px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 4px;
            height: 100%;
            background-color: var(--primary);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.08);
            border-color: #fed7aa;
        }

        .card:hover::before {
            opacity: 1;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .card-category {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--primary-dark);
            background-color: var(--primary-light);
            padding: 4px 12px;
            border-radius: 12px;
            text-transform: uppercase;
        }

        .card-price {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--primary);
            background: #fff7ed;
            padding: 4px 12px;
            border-radius: 10px;
            border: 1px dashed #fdba74;
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .card-description {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid #f5f5f4;
        }

        .order-btn {
            width: 100%;
            padding: 10px 16px;
            background-color: #f5f5f4;
            color: var(--text-main);
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .card:hover .order-btn {
            background-color: var(--primary);
            color: white;
        }

        /* Empty State */
        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 60px 20px;
            color: var(--text-muted);
            box-shadow: var(--shadow-sm);
        }

        .no-results-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            display: block;
        }

        /* Responsiveness */
        @media (max-width: 640px) {
            .hero-title {
                font-size: 2rem;
            }
            .categories-wrapper {
                justify-content: flex-start;
                overflow-x: auto;
                padding-bottom: 10px;
                flex-wrap: nowrap;
            }
            .category-btn {
                white-space: nowrap;
            }
        }
    </style>
</head>
<body>
    <header class="hero-banner">
        <h1 class="hero-title">قائمة الطعام</h1>
        <p class="hero-subtitle">استمتع بأشهى المأكولات المحضرة بفرش وأجود المكونات اليومية</p>
    </header>

    <div class="container">
        <div class="search-wrapper">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن وجبة، مكون، أو صنف...">
            </div>
        </div>
